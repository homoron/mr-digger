<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#202329">
	<title>Mr. Digger</title>
	<style>
		html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14181c; color: #f5e9d1; }
		body { touch-action: none; }
		#canvas { display: block; outline: none; }
		#status { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; background: #202329; font: 18px system-ui, sans-serif; }
		#status progress { width: min(280px, 70vw); accent-color: #d6ad62; }
		#status-notice { max-width: min(460px, 85vw); white-space: pre-line; }
		#fullscreen { position: fixed; bottom: 12px; right: 12px; z-index: 2; width: 40px; height: 36px; display: grid; place-items: center; border: 1px solid #d6ad6270; border-radius: 5px; background: #14181cbb; color: #f5e9d1; opacity: .65; cursor: pointer; }
		#fullscreen:hover, #fullscreen:focus-visible { opacity: 1; border-color: #d6ad62; outline: 2px solid #d6ad62; outline-offset: 2px; }
		#fullscreen[hidden], #status[hidden] { display: none; }
		#fullscreen svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas" tabindex="0" aria-label="Mr. Digger">Tu navegador no admite este juego.</canvas>
	<button id="fullscreen" type="button" title="Pantalla completa (F11)" aria-label="Pantalla completa" aria-pressed="false" hidden>
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
	</button>
	<div id="status" role="status">
		<div>Mr. Digger</div>
		<progress id="status-progress" aria-label="Cargando"></progress>
		<div id="status-notice">Cargando…</div>
	</div>
	<noscript>Activa JavaScript para jugar.</noscript>
	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args": [], "canvasResizePolicy": 2, "emscriptenPoolSize": 8, "ensureCrossOriginIsolationHeaders": true, "executable": "index", "experimentalVK": false, "fileSizes": {"index.wasm": 39514754, "mr-digger-d526f40046fb.pck": 9417548}, "focusCanvas": true, "gdextensionLibs": [], "godotPoolSize": 4, "mainPack": "mr-digger-d526f40046fb.pck"};
		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);
		const canvas = document.getElementById('canvas');
		const fullscreen = document.getElementById('fullscreen');
		const overlay = document.getElementById('status');
		const progress = document.getElementById('status-progress');
		const notice = document.getElementById('status-notice');

		function fullscreenElement() {
			return document.fullscreenElement || document.webkitFullscreenElement;
		}

		function updateFullscreen() {
			const active = Boolean(fullscreenElement());
			fullscreen.setAttribute('aria-pressed', String(active));
			fullscreen.setAttribute('aria-label', active ? 'Salir de pantalla completa' : 'Pantalla completa');
			fullscreen.title = active ? 'Salir de pantalla completa (Esc o F11)' : 'Pantalla completa (F11)';
			canvas.focus({ preventScroll: true });
		}

		function toggleFullscreen() {
			// Call the browser API directly during the click/key gesture.
			const target = document.documentElement;
			const exit = document.exitFullscreen || document.webkitExitFullscreen;
			const enter = target.requestFullscreen || target.webkitRequestFullscreen;
			try {
				const request = fullscreenElement() ? exit.call(document) : enter.call(target);
				Promise.resolve(request).catch(() => { fullscreen.title = 'No se pudo activar la pantalla completa. Inténtalo de nuevo.'; });
			} catch (_) {
				fullscreen.title = 'La pantalla completa no está disponible en este navegador.';
			}
			canvas.focus({ preventScroll: true });
		}

		if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
			fullscreen.hidden = false;
			fullscreen.addEventListener('click', toggleFullscreen);
			window.addEventListener('keydown', (event) => {
				if (event.key === 'F11' && !event.repeat) {
					event.preventDefault();
					toggleFullscreen();
				}
			}, true);
			document.addEventListener('fullscreenchange', updateFullscreen);
			document.addEventListener('webkitfullscreenchange', updateFullscreen);
		}

		function failure(error) {
			console.error(error);
			progress.hidden = true;
			notice.textContent = 'No se pudo iniciar el juego.\n' + (error.message || String(error));
		}

		const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
		if (missing.length) {
			failure(new Error('El navegador necesita: ' + missing.join(', ')));
		} else {
			engine.startGame({
				onProgress(current, total) {
					if (total > 0) { progress.max = total; progress.value = current; }
					else { progress.removeAttribute('value'); }
				}
			}).then(() => { overlay.hidden = true; canvas.focus(); }, failure);
		}
	</script>
</body>
</html>
